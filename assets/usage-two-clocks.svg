<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">One app, two usage clocks</title><desc id="desc">A hypothetical app has 120 requests across a day and 20 requests in its busiest minute. Daily request limits and minute-level request and token limits must be checked separately.</desc>
<rect width="1200" height="540" rx="30" fill="#061a33"/>
<text x="58" y="77" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">One app, two usage clocks</text>
<text x="58" y="115" fill="#b8d0e3" font-family="Arial,Helvetica,sans-serif" font-size="20">Illustrative workload · not measured traffic</text>
<rect x="58" y="150" width="500" height="280" rx="20" fill="#0c2a46" stroke="#27d6d3" stroke-width="3"/>
<rect x="642" y="150" width="500" height="280" rx="20" fill="#0c2a46" stroke="#ffbe55" stroke-width="3"/>
<text x="88" y="203" fill="#7cecea" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">ACROSS THE DAY</text>
<text x="672" y="203" fill="#ffd38a" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">BUSIEST MINUTE</text>
<text x="88" y="273" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">120</text>
<text x="245" y="270" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="25">requests / day</text>
<text x="672" y="273" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">20</text>
<text x="787" y="270" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="25">requests / minute</text>
<text x="88" y="320" fill="#b8d0e3" font-family="Arial,Helvetica,sans-serif" font-size="20">40 testers × 3 prompts each</text>
<text x="672" y="320" fill="#b8d0e3" font-family="Arial,Helvetica,sans-serif" font-size="20">A concentrated burst from that day</text>
<rect x="88" y="352" width="430" height="46" rx="12" fill="#124b5b"/>
<rect x="672" y="352" width="430" height="46" rx="12" fill="#654319"/>
<text x="104" y="382" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">Compare with the daily request cap</text>
<text x="689" y="382" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">Compare with RPM and token caps</text>
<path d="M560 290 L637 290" stroke="#9eb7cb" stroke-width="3" stroke-dasharray="7 8"/>
<text x="58" y="487" fill="#d8e6f0" font-family="Arial,Helvetica,sans-serif" font-size="20">Passing one clock does not mean the app passes the other.</text>
</svg>
